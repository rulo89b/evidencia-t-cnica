
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#17324D">

    <title>Sin conexión - Evidencia Técnica</title>

    <link rel="stylesheet" href="/static/css/app.css">
</head>

<body>

    <main>
        <article style="max-width:480px;
                        margin:60px auto;
                        text-align:center;">

            <img
                src="/static/icons/icon-192.png"
                alt="Evidencia Técnica"
                width="96"
                height="96"
                style="border-radius:20px;"
            >

            <h1>Sin conexión</h1>

            <p>
                No se pudo establecer comunicación
                con el servidor.
            </p>

            <p class="muted">
                Evidencia Técnica necesita conexión
                a internet para consultar trabajos
                y guardar fotografías.
            </p>

            <button onclick="window.location.reload()">
                Reintentar conexión
            </button>

        </article>
    </main>

</body>
</html>
