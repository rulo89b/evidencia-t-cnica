
{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}

<h2>{{ title }}</h2>

<p>Plantilla: {{ template.name }}</p>

<form method="post">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Guardar
    </button>

    <a href="{% url 'servicios:template_detail' template.pk %}">
        Cancelar
    </a>

</form>

{% endblock %}
