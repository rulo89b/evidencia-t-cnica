
{% extends "base.html" %}

{% block title %}Iniciar sesión | Evidencia Técnica{% endblock %}

{% block content %}

<h2>Iniciar sesión</h2>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <input type="hidden" name="next" value="{{ next }}">

    <button type="submit">
        Iniciar sesión
    </button>
</form>

<p>
    ¿Todavía no tienes una cuenta?

    <a href="{% url 'usuarios:register' %}">
        Regístrate
    </a>
</p>

{% endblock %}
