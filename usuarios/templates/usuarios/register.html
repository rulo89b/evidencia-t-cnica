
{% extends "base.html" %}

{% block title %}Registro | Evidencia Técnica{% endblock %}

{% block content %}

<h2>Crear cuenta</h2>

<form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Registrarse
    </button>
</form>

<p>
    ¿Ya tienes una cuenta?

    <a href="{% url 'usuarios:login' %}">
        Inicia sesión
    </a>
</p>

{% endblock %}
